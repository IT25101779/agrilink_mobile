# Save as codemagic.yaml in the ROOT of github.com/IT25101779/agrilink_mobile
# (the same folder that contains pubspec.yaml, lib/, android/, ios/).
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Check project layout
        script: |
          set -ex
          pwd
          ls
          test -f pubspec.yaml
      - name: Build APK
        script: |
          set -ex
          flutter pub get
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-unsigned-sideload:
    name: iOS Unsigned Build for Sideloading
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Check project layout
        script: |
          set -ex
          pwd
          ls
          test -f pubspec.yaml
      - name: Build and package unsigned .ipa
        script: |
          set -ex
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -r GoviTech-unsigned.ipa Payload
          ls -la
    artifacts:
      - build/ios/iphoneos/*.ipa
