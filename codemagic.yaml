# Save as codemagic.yaml next to pubspec.yaml in the agrilink_mobile repo.
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          set -ex
          test -f pubspec.yaml
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/GoviTech.apk"
          ls -la "$CM_BUILD_DIR"
    artifacts:
      - GoviTech.apk
      - build/app/outputs/flutter-apk/*.apk

  ios-unsigned-sideload:
    name: iOS Unsigned Build for Sideloading
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build and package unsigned .ipa
        script: |
          set -ex
          test -f pubspec.yaml
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          ls -la build/ios/iphoneos/
          rm -rf "$CM_BUILD_DIR/Payload" "$CM_BUILD_DIR/GoviTech-unsigned.ipa"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R build/ios/iphoneos/Runner.app "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -qry GoviTech-unsigned.ipa Payload
          ls -la "$CM_BUILD_DIR"
          find "$CM_BUILD_DIR" -maxdepth 4 -name "*.ipa"
    artifacts:
      - GoviTech-unsigned.ipa
      - build/ios/iphoneos/*.app
