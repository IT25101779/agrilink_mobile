# Save as codemagic.yaml next to pubspec.yaml in the agrilink_mobile repo.
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          set -ex
          cd "$CM_BUILD_DIR"
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/GoviTech.apk"
          ls -la "$CM_BUILD_DIR"
    artifacts:
      - GoviTech.apk

  ios-unsigned-sideload:
    name: iOS Unsigned Build for Sideloading
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build and package unsigned .ipa
        script: |
          set -ex
          cd "$CM_BUILD_DIR"
          flutter pub get
          flutter build ios --release --no-codesign
          rm -rf Payload GoviTech-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry GoviTech-unsigned.ipa Payload
          ls -la "$CM_BUILD_DIR"
    artifacts:
      - GoviTech-unsigned.ipa
