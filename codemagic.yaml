# Put this file at the ROOT of the GitHub repo (next to the agrilink_mobile and
# agrilink-backend folders) and name it exactly: codemagic.yaml
# Codemagic only looks for it at the repo root, so every script cd's into agrilink_mobile.
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get packages and build APK
        script: |
          cd agrilink_mobile
          flutter pub get
          flutter build apk --release
    artifacts:
      - agrilink_mobile/build/app/outputs/flutter-apk/app-release.apk

  ios-unsigned-sideload:
    name: iOS Unsigned Build for Sideloading
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build and package unsigned .ipa
        script: |
          cd agrilink_mobile
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -r GoviTech-unsigned.ipa Payload
    artifacts:
      - agrilink_mobile/build/ios/iphoneos/GoviTech-unsigned.ipa
